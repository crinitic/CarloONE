name: Build and Push to Release Branch

on:
  push:
    branches:
      - master

permissions:
  contents: write # Crucial: Allows the runner to push code back into your repository

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Pandoc and WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc weasyprint

      - name: Create Build Directory
        run: mkdir public

      - name: Generate HTML Resume
        run: |
          pandoc resume.md \
            --standalone \
            --css=style.css \
            -o public/index.html \
            --metadata title="Resume"

      - name: Generate PDF Resume
        run: |
          pandoc resume.md \
            --pdf-engine=weasyprint \
            --css=style.css \
            -o public/resume.pdf

      - name: Deploy to gh-pages Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages # The workflow automatically handles creating this branch if it doesn't exist
